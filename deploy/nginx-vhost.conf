server {
    listen 80;
    server_name id.rajeev.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name id.rajeev.me;

    ssl_certificate     /etc/letsencrypt/live/id.rajeev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.rajeev.me/privkey.pem;

    # Argus serves its own minimal UI — no static root needed.
    #
    # PRODUCTION CUTOVER (Governance Hub docs/MIGRATION_GOALS.md):
    # "Keep OIDC/login/consent endpoints public as required by protocol;
    # restrict /api/admin/* to Hub service client." The Hub proxies Argus
    # server-side over 127.0.0.1:8443, so the admin API is limited to the
    # Tailscale tailnet (100.64.0.0/10).

    # Admin API — tailnet only (Hub reaches Argus server-side, not here).
    location /api/admin/ {
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OIDC protocol endpoints and login/consent UI stay public.
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
